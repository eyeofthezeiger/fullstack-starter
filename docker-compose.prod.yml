# Prod-like run of the whole stack: docker compose -f docker-compose.prod.yml up --build
# Credentials here are local placeholders. Real deploys read secrets from the platform.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: app
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      retries: 15

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      retries: 15

  migrate:
    build: { context: ., dockerfile: server/Dockerfile }
    command: ['node', 'dist/migrate.js', 'up']
    environment: &server-env
      NODE_ENV: production
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-change-me}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres: { condition: service_healthy }

  server:
    build: { context: ., dockerfile: server/Dockerfile }
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 5s
      retries: 10

  client:
    build: { context: ., dockerfile: client/Dockerfile }
    ports: ['8080:80']
    depends_on:
      server: { condition: service_healthy }

volumes:
  pgdata:
