      # Fly.io:
      #   - uses: superfly/flyctl-actions/setup-flyctl@master
      #   - flyctl deploy --image ghcr.io/<owner>/<repo>-server:${{ github.sha }}
      #     env: FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # ---------------------------------------------------------------------
      - name: Deploy (placeholder)
        run: echo "Deploy step not configured. Edit .github/workflows/deploy.yml."
