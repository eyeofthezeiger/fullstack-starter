name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push images to GHCR
  # id-token: write # uncomment for OIDC login to AWS, GCP or Azure (no long-lived keys)

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, client]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production # add required reviewers in repo settings if you want a gate
    steps:
      # ---------------------------------------------------------------------
      # PLACEHOLDER: swap this step for your target. Images to deploy:
      #   ghcr.io/<owner>/<repo>-server:<sha>   ghcr.io/<owner>/<repo>-client:<sha>
      # Run migrations first: the server image runs `npm run migrate:prod`.
      #
      # AWS ECS (OIDC, no stored keys):
      #   - uses: aws-actions/configure-aws-credentials@v4
      #     with: { role-to-assume: <role-arn>, aws-region: us-east-1 }
      #   - aws ecs update-service --cluster app --service server --force-new-deployment
